# test 프로필: DB 접속 정보를 여기 적지 않는다.
# 테스트마다 TestMySqlConfig 가 MySQL 컨테이너를 띄우고 @ServiceConnection 이 url/계정을 DataSource 에 꽂는다.
spring:
  jpa:
    hibernate:
      ddl-auto: update   # 새 컨테이너의 빈 DB 에 엔티티대로 테이블을 만든다
    show-sql: false      # System.out 대신 아래 로거로 SQL 을 찍는다 → 로그에 스레드 이름이 붙어 동시성 실습에서 "누가 실행했나" 를 읽을 수 있다

logging:
  level:
    org.hibernate.SQL: DEBUG
